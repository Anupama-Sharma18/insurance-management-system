spring.application.name=policy-closure-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/policy_closure_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Test policy store is local/in-memory in this split version.
# Configure the real Policy and Claims service URLs before production use.
policy.service.url=http://localhost:8088
claims.service.url=http://localhost:8090

# TEST ONLY: assumes no active claims until real Claims API is connected.
claims.eligibility.test-mode=true
